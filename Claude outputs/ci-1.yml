name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: Relay tests (workerd)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/relay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/relay/package-lock.json

      - run: npm ci

      # Piped through a file so the fallback tripwire below can read it. `npm
      # test` writing to a pipe still fails the step on a red suite because of
      # pipefail, which bash -o is not set by default for — hence the explicit
      # PIPESTATUS check rather than trusting the pipeline's exit code.
      - name: Run the suite
        run: |
          set +e
          npm test 2>&1 | tee /tmp/relay.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      # The compatibility date lives in wrangler.toml and is what a deploy uses.
      # When the pinned wrangler's workerd is older than that date, miniflare
      # quietly falls back and the suite proves things about a runtime nobody
      # ships. It is a warning, not an error, so nothing else would catch it.
      - name: Fail if the test runtime is not production's
        run: |
          if grep -q "Falling back to" /tmp/relay.log; then
            echo "::error::miniflare fell back to an older compatibility date — tests ran on a different runtime than a deploy would. Upgrade wrangler or lower compatibility_date in wrangler.toml."
            grep -A1 "Falling back to" /tmp/relay.log
            exit 1
          fi

  test:
    name: Unit + integration tests (headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot

      - name: Import project
        run: ~/godot/godot --headless --path . --import || true

      - name: Run tests
        run: GODOT_BIN=~/godot/godot bash tools/run_tests.sh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit4-report
          path: reports/
          if-no-files-found: ignore

  export-web:
    name: Export web build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-templates

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --path . --import || true

      - name: Export
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: export-web
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
